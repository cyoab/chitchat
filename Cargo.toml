[package]
name = "chitchat"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared memory and a project group chat for Claude Code and Codex agents, over MCP"
repository = "https://github.com/cyoab/chitchat"
readme = "README.md"
keywords = ["mcp", "agents", "claude", "codex", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rmcp = { version = "3.4.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
# "abort" would save ~0.5 MB, but a panicking tool call would then kill the agent's
# MCP server, and Claude Code does not restart stdio servers.
panic = "unwind"
